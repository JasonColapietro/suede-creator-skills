interface:
  display_name: "Suede Content Strategy"
  short_description: "Decide what to publish and why"
  default_prompt: "Use $suede-content-strategy on [target]. The user does not know what to write about, or needs a content plan, editorial calendar, or topic strategy. Work through topic clusters, content pillars, editorial cadence, distribution planning, and what to stop writing, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
