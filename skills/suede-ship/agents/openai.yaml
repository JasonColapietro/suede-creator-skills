interface:
  display_name: "Suede Ship"
  short_description: "Canonical shipping DAG: scout, plan, build, refute, gate"
  default_prompt: "Use $suede-ship to take [scope] through the canonical Suede DAG in [repo]. Scout the repo for blocking hazards, sweep it with multi-lens research where every claim carries a file:line or sha, let a completeness critic name what went unread, plan lanes with explicit file ownership, build the disjoint lanes in parallel with each pipelined into its own review, refute every finding adversarially so a majority kills it, then gate on typecheck, build, and tests against the integrated worktree before writing an evidence handoff. Halt and report rather than plow through on a blocking hazard (a real secret in a tracked file, a live process holding a target worktree) or a lane collision. State the cost before launching: this is roughly fifty agents of Claude fan-out, and high-volume, well-specified work belongs in suede-codex-fleet instead. The ship verdict is advisory, and the workflow reads production but never deploys, so never claim deployed, verified live, or released."
policy:
  allow_implicit_invocation: true
