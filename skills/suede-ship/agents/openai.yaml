interface:
  display_name: "Suede Ship"
  short_description: "Graph search for one evidence-gated repo change"
  default_prompt: "Use $suede-ship for a Graph-of-Thoughts shipping search on [repo] to deliver [multi-file scope]. Ask for the repo, scope, and light|standard|deep budget; detect and pass optional deploys, liveUrl, and vault context; state the exact 55|110|200 total-agent ceiling before launch. Run Generate, Score, KeepBestN, paired concrete-defect Refute, Improve, Aggregate, and Select; only the selected plan may mutate and every mutating call must carry its canonical selected-file allowlist. Budget exhaustion prevents the next call or whole mutating batch but does not undo completed mutations. Halt for hazards, collisions, missing context, budget exhaustion, or no winner, then report options and wait. Write the returned handoff to .suede-ship/${runId}/handoff.md. Read production only and never deploy, publish, release, or claim live verification. Route bulk independent work to suede-codex-fleet, findings-only review to suede-code-review, CI wiring to suede-ci-gate, and copy-only shipping to suede-ship-copy."
policy:
  allow_implicit_invocation: true
