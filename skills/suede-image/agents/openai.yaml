interface:
  display_name: "Suede Image"
  short_description: "Create and optimise marketing imagery"
  default_prompt: "Use $suede-image on [target]. The user needs marketing images, graphics, mockups, or help getting better output from an image model. Work through prompt craft for AI generation, hero and social graphics, product mockups, and export and compression discipline, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
