interface:
  display_name: "Suede Product Marketing"
  short_description: "Establish the product context every other marketing lane"
  default_prompt: "Use $suede-product-marketing on [target]. The user is starting marketing work and no shared product, audience, or positioning context exists yet. Work through what it is, who it is for, the positioning, and the proof, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
