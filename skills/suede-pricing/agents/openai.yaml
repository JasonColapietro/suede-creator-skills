interface:
  display_name: "Suede AI Pricing Skills"
  short_description: "Value metrics, tiers, pricing pages, and paywalls"
  default_prompt: "Use $suede-pricing on [target]. The user is deciding what to charge, restructuring plans, pricing AI features, weighing a free tier or trial, raising prices, fixing a pricing page, or building or improving an in-product upgrade screen, feature gate, usage limit, or trial-expiry prompt. Work through value metric, tiers, willingness-to-pay research, and migration; run the two-axis teardown for buyer clarity and search and AI readability; or, in Paywall mode, set trigger timing and frequency caps, draft the screen, and run the dark-pattern self-check and the current subscription-law check (US, UK, EU, app stores). Return the Pricing Decision Brief, the teardown, or the Paywall Package (screen drafts, trigger rules, experiment plan), with assumptions and what to measure next."
policy:
  allow_implicit_invocation: true
