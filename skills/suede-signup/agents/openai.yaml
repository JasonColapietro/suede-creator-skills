interface:
  display_name: "Suede Signup"
  short_description: "Suede accessible signup and registration experiments"
  default_prompt: "Use $suede-signup on [target]. The user has a signup, registration, or trial-start flow that loses people partway through. Work through field-by-field audit, social versus email tradeoffs, progressive profiling, and recovering abandoned signups, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
