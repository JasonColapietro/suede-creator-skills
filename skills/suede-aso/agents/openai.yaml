interface:
  display_name: "Suede ASO"
  short_description: "Optimise an App Store or Play listing"
  default_prompt: "Use $suede-aso on [target]. The user wants to improve app store visibility, downloads, or listing conversion, or has shared an App Store or Play URL. Work through keyword field strategy, title and subtitle, screenshots that convert, and competitor listing teardowns, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
