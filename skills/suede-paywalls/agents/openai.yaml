interface:
  display_name: "Suede Paywalls"
  short_description: "Design in-app upgrade moments that convert without resentment"
  default_prompt: "Use $suede-paywalls on [target]. The user wants to build or improve an in-product upgrade screen, feature gate, or trial-expiration prompt. Work through paywall screens, feature gates, trial-expiry states, and free-to-paid prompts, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
