interface:
  display_name: "Suede Offer Design"
  short_description: "Construct the thing you actually sell"
  default_prompt: "Use $suede-offers on [target]. The user is building or fixing an offer for a service, agency, course, coaching, info product, or high-ticket B2B sale. Work through value framing, bonus stacking, guarantee and risk-reversal design, honest scarcity, naming, and payment structure, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
