interface:
  display_name: "Suede Marketing Council"
  short_description: "Convene a panel of legendary marketers on one question"
  default_prompt: "Use $suede-marketing-council on [target]. The user wants multiple expert perspectives, a simulated advisory board, or how a specific famous marketer would approach their problem. Work through Convene a panel of legendary marketers on one question, surface where they disagree, and synthesise a recommendation from the strongest arguments, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
