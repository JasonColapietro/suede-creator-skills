interface:
  display_name: "Suede Design"
  short_description: "Design laws, tokens, restyles, and visual QA for any interface"
  default_prompt: "Use $suede-design on [repo/route]. Read PRODUCT.md and DESIGN.md, state the SUEDE_DESIGN_PREFLIGHT with the mode, apply the design laws, render at 1280px desktop and 390px mobile, and run visual QA. For a restyle, give me the reference URL and the target URL."
policy:
  allow_implicit_invocation: true
