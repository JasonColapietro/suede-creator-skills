interface:
  display_name: "Suede Prospecting"
  short_description: "Suede source-backed prospect lists and qualification"
  default_prompt: "Use $suede-prospecting on [target]. The user needs a prospect or lead list, or is deciding which accounts to go after. Work through ICP fit, sourcing, enrichment, disqualification, and where the first customers actually are, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
policy:
  allow_implicit_invocation: true
