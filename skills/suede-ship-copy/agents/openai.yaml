interface:
  display_name: "Suede Ship Copy"
  short_description: "Copy DAG: research, claim audit, write, refute, deslop, gate"
  default_prompt: "Use $suede-ship-copy to take [piece] through the Suede copy DAG for a [surface]. Capture the published text as a baseline, put anything the requester states themselves in the given arg, sweep with five blind research lenses where every fact carries a file:line or url, then audit the agent-generated facts only. Never audit, verify, hedge, or gate on a given: it skips the audit, and a review finding aimed at one is discarded at any severity before a verifier is spent on it. Generate three angles, plan a section map where each section owns one message and cites only permitted claims, write the sections in parallel, assemble one voice, review with four lenses, refute so both verifiers must fail to refute, then deslop and run the deterministic checks before a read-only publish-readiness gate. Never invent a number, date, price, or customer result: write [AUTHOR: supply X]. Ask for the piece and surface if missing. State the cost first: about thirty agents. This writes a draft and never publishes."
policy:
  allow_implicit_invocation: true
