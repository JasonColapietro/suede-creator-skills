interface:
  display_name: "Suede Directory Submissions"
  short_description: "Work the directory layer deliberately"
  default_prompt: "Use $suede-directory-submissions on [target]. The user is submitting a product to startup, SaaS, AI, or MCP directories, or wants backlinks from listings. Work through which listings carry dofollow weight, submission order, launch-day sequencing, and verifying the backlink landed, ground every recommendation in evidence the user can check, and return the decisions, the reasoning, and what to measure next."
