name: Directory listing request
description: Add, correct or remove a skill in the Agent Skills Directory at skills.suedeai.ai/directory/
title: "Directory: "
labels: ["directory", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        The [Agent Skills Directory](https://skills.suedeai.ai/directory/) lists public skills that pass the [Suede Skill Check](https://skills.suedeai.ai/directory/methodology/). You can request selected skills by name or explicitly request the whole repository. A selected-skill request covers only the named skills; other skills and future additions require a separate review.
  - type: dropdown
    id: request
    attributes:
      label: Request
      options:
        - Add my skills
        - Verify my README badge for featured placement
        - Help improve my quality score
        - Recheck my updated skill
        - Correct a listing
        - Remove a listing
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Public GitHub repository
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: skill-scope
    attributes:
      label: Skill names or listing scope
      description: For additions, list the exact names from SKILL.md, one per line. Write "all" only to request every skill in the repository. For other requests, name the affected skills or write "all" if the request applies to every listing.
      placeholder: |
        article-writer
        url-shortener
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: For additions, include review context for the requested skills. For badge verification, give the listing URL and README path with the linked badge. For score help or a fresh review, give the listing URL, previous report or snapshot, changed commit or PR, and points to recheck. For a correction or removal, describe the change.
    validations:
      required: false
  - type: checkboxes
    id: maintainer
    attributes:
      label: Confirmation
      options:
        - label: I maintain this repository, or I am requesting a listing for a public repository on its maintainers' behalf.
          required: true
