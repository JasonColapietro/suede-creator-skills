name: Style trust strip

on:
  push:
    branches:
      - feat/external-trust-signals

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/external-trust-signals
      - name: Add install-page trust badge styling
        shell: python
        run: |
          from pathlib import Path
          p = Path("docs/plugins.html")
          text = p.read_text(encoding="utf-8")
          css_marker = '    .lead a:hover, .prose a:hover { border-bottom-color: var(--gold); }'
          css_block = css_marker + '''\n    .trust-badge {\n      display: inline-flex; align-items: center; min-height: 36px;\n      padding: 7px 11px; border: 1px solid rgba(200, 169, 110, 0.38);\n      border-radius: 4px; background: rgba(200, 169, 110, 0.07);\n      color: var(--gold); font-family: var(--mono); font-size: 12px;\n      line-height: 1.35; transition: border-color 0.15s, background 0.15s;\n    }\n    .trust-badge:hover { border-color: var(--gold); background: rgba(200, 169, 110, 0.12); }'''
          if text.count(css_marker) != 1:
              raise SystemExit("plugins CSS marker drifted")
          text = text.replace(css_marker, css_block, 1)
          text = text.replace('<a class="badge badge-gold" href="https://hol.org/registry/plugins/suede-labs-ai%2Fsuede-skills"', '<a class="trust-badge" href="https://hol.org/registry/plugins/suede-labs-ai%2Fsuede-skills"', 1)
          text = text.replace('<a class="badge badge-gold" href="https://pluginworld.ai/plugins/claude-code/jasoncolapietro/suede-creator-skills"', '<a class="trust-badge" href="https://pluginworld.ai/plugins/claude-code/jasoncolapietro/suede-creator-skills"', 1)
          p.write_text(text, encoding="utf-8")
      - name: Verify trust-signal regression test
        run: python3 -m unittest tests/test_external_trust_signals.py -v
      - name: Commit patch
        run: |
          git config user.name "Suede-AI"
          git config user.email "193284465+Suede-AI@users.noreply.github.com"
          git add docs/plugins.html
          git commit -m "style: make registry trust links visible on install page"
          git push origin HEAD:feat/external-trust-signals
