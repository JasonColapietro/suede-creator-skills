name: IndexNow

# Tells the IndexNow network which URLs are live once a production deploy has
# finished. IndexNow reaches Bing (which ChatGPT search and Copilot draw on),
# plus Yandex, Seznam, Naver and Yep. Google does not take part; the sitemap in
# Search Console covers Google.
#
# skills.suedeai.ai is served by GitHub Pages from docs/, so a deploy is the
# pages-build-deployment run. The same deploy also emits a deployment_status
# event. Submit once after the Pages workflow succeeds, with the weekly
# schedule and manual dispatch available if a deploy event is missed.
on:
  workflow_run:
    workflows: ["pages-build-deployment"]
    types: [completed]
  schedule:
    - cron: "41 8 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    # Deploy events count only when the Pages deploy succeeded; the schedule
    # and manual runs always submit.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Submit live sitemap URLs to IndexNow
        run: >-
          node scripts/indexnow-submit.mjs
          --site https://skills.suedeai.ai
          --sitemap /sitemap.xml
          --key-file docs/333af61b5cb0a1ed159ec1b12ecf4d99.txt
