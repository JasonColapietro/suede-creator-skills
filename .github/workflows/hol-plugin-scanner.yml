name: HOL Plugin Scanner

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: HOL Plugin Scanner
        uses: hashgraph-online/ai-plugin-scanner-action@7711de3234c244b562519720ef749f4b432b69be # v1.2.795
        # This action pins plugin-scanner 3.51.0 and its runtime by hash.
        # Cisco runs explicitly in skill-source-security.yml with a separate
        # reviewed lock and offline container; no auto-detection is evidence.
        with:
          plugin_dir: "."
          mode: scan
          min_score: 80
          fail_on_severity: high
          format: sarif
          output: ai-plugin-scanner.sarif
          upload_sarif: true
          install_cisco: false
          cisco_skill_scan: off
          online: false
          trust_repository_policy: false
          pr_comment: off

      - name: Retain HOL machine-readable findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hol-security-${{ github.event.pull_request.head.sha || github.sha }}
          path: ai-plugin-scanner.sarif
          if-no-files-found: error
          retention-days: 14

      - name: Show scanner finding locations after failure
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = Path("ai-plugin-scanner.sarif")
          if report.is_file():
              for run in json.loads(report.read_text()).get("runs", []):
                  for result in run.get("results", []):
                      print(json.dumps({
                          "rule": result.get("ruleId"),
                          "level": result.get("level"),
                          "locations": [{
                              "file": location.get("physicalLocation", {}).get("artifactLocation", {}).get("uri"),
                              "line": location.get("physicalLocation", {}).get("region", {}).get("startLine"),
                          } for location in result.get("locations", [])],
                      }))
          PY
