<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="488" viewBox="0 0 1200 488" role="img" aria-labelledby="t d">
  <title id="t">The pack at a glance</title>
  <desc id="d">63 skills across six lanes: marketing and growth 38, design copy and SEO 7, orchestration and workflows 7, code quality and shipping 4, creator rights and release 4, mobile apps 3.</desc>
  <rect width="1200" height="488" rx="16" fill="#080808"/>
  <rect x="1" y="1" width="1198" height="486" rx="15" fill="none" stroke="#222222" stroke-width="2"/>

  <text x="56" y="64" fill="#c8a96e" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3">THE PACK AT A GLANCE</text>
  <text x="56" y="104" fill="#f0ece4" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">Six lanes, one install</text>

  <!-- rows: label right-aligned at 340, bars from 360, scale 640px = 38 skills -->
  <g font-family="Arial, Helvetica, sans-serif">
    <!-- Marketing & growth -->
    <text x="340" y="169" text-anchor="end" fill="#f0ece4" font-size="17" font-weight="700">Marketing &amp; growth</text>
    <rect x="360" y="150" width="640" height="28" rx="6" fill="#c8a96e"/>
    <text x="1014" y="170" fill="#f0ece4" font-size="17" font-weight="800">38</text>

    <!-- Design, copy & SEO -->
    <text x="340" y="221" text-anchor="end" fill="#f0ece4" font-size="17" font-weight="700">Design, copy &amp; SEO</text>
    <rect x="360" y="202" width="118" height="28" rx="6" fill="#c8a96e"/>
    <text x="492" y="222" fill="#f0ece4" font-size="17" font-weight="800">7</text>

    <!-- Orchestration & workflows -->
    <text x="340" y="273" text-anchor="end" fill="#f0ece4" font-size="17" font-weight="700">Orchestration &amp; workflows</text>
    <rect x="360" y="254" width="118" height="28" rx="6" fill="#c8a96e"/>
    <text x="492" y="274" fill="#f0ece4" font-size="17" font-weight="800">7</text>

    <!-- Code quality & shipping -->
    <text x="340" y="325" text-anchor="end" fill="#f0ece4" font-size="17" font-weight="700">Code quality &amp; shipping</text>
    <rect x="360" y="306" width="67" height="28" rx="6" fill="#c8a96e"/>
    <text x="441" y="326" fill="#f0ece4" font-size="17" font-weight="800">4</text>

    <!-- Creator rights & release -->
    <text x="340" y="377" text-anchor="end" fill="#f0ece4" font-size="17" font-weight="700">Creator rights &amp; release</text>
    <rect x="360" y="358" width="67" height="28" rx="6" fill="#c8a96e"/>
    <text x="441" y="378" fill="#f0ece4" font-size="17" font-weight="800">4</text>

    <!-- Mobile apps -->
    <text x="340" y="429" text-anchor="end" fill="#f0ece4" font-size="17" font-weight="700">Mobile apps</text>
    <rect x="360" y="410" width="51" height="28" rx="6" fill="#c8a96e"/>
    <text x="425" y="430" fill="#f0ece4" font-size="17" font-weight="800">3</text>
  </g>

  <text x="56" y="464" fill="#888880" font-family="Arial, Helvetica, sans-serif" font-size="13.5">Inspect the instructions, install the workflows you need, and ship with evidence.</text>
</svg>
