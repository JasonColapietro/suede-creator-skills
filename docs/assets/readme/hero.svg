  <text x="1144" y="290" text-anchor="end" fill="#c8a96e" font-family="Arial, Helvetica, sans-serif" font-size="200" font-weight="900" letter-spacing="-12">73</text>
  <text x="1138" y="330" text-anchor="end" fill="#888880" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">SKILLS &#183; LICENSES INCLUDED &#183; OPEN SOURCE</text>

