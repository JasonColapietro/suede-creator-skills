<!doctype html><meta charset="utf-8">
<meta name="robots" content="noindex">
<title>SuedeAI.directory social card</title>
<!-- Open Graph image for every SuedeAI.directory page. Render at 1200x630:
     see README.md. The matrix is directory-card-matrix.svg, a copy of
     docs/directory/skill-matrix.svg; refresh the copy before a re-render.
     The card states no counts, so it does not go stale between refreshes. -->
<style>
  @font-face{font-family:Geist;src:url("../fonts/geist-var-latin.woff2") format("woff2");font-weight:100 900}
  @font-face{font-family:"Geist Mono";src:url("../fonts/geist-mono-var-latin.woff2") format("woff2");font-weight:100 900}
  @font-face{font-family:"Pixelify Sans";src:url("../fonts/pixelify-sans-var-latin.woff2") format("woff2");font-weight:400 700}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#000}
  body{font-family:Geist,sans-serif;-webkit-font-smoothing:antialiased;color:#ededed}
  .card{position:relative;width:1200px;height:630px;padding:48px 64px 52px;display:grid;grid-template-rows:auto 1fr auto;row-gap:28px;border:1px solid #1f1f1f}
  .top{display:flex;justify-content:space-between;align-items:center}
  .mark{display:flex;align-items:center;gap:14px;font-family:"Pixelify Sans";font-weight:600;font-size:30px;letter-spacing:.01em}
  .mark img{width:40px;height:40px}
  .by{font-family:"Geist Mono";font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:#a0a0a0}
  .by b{color:#ededed;font-weight:500}
  .body{display:grid;grid-template-columns:610px 1fr;column-gap:44px;align-items:center}
  h1{font-family:"Pixelify Sans";font-weight:600;font-size:62px;line-height:1.06;letter-spacing:.005em}
  h1 i{font-style:normal;margin-left:10px}
  .sub{margin-top:22px;font-size:23px;line-height:1.45;color:#d4d4d4;max-width:560px}
  .field{position:relative;padding:12px;background:#0a0a0a;border:1px solid #292929;border-radius:4px}
  .field img{display:block;width:100%;height:auto}
  .field:before,.field:after{content:"";position:absolute;width:14px;height:14px;border-color:#ededed;border-style:solid}
  .field:before{top:-1px;left:-1px;border-width:2px 0 0 2px}
  .field:after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
  .legend{display:flex;gap:18px;margin-top:12px;font-family:"Geist Mono";font-size:14px;color:#a0a0a0}
  .legend i{display:inline-block;width:11px;height:11px;margin-right:7px;vertical-align:-1px}
  .chips{display:flex;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #292929;border-radius:3px;background:#0a0a0a;font-family:"Geist Mono";font-size:15px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:#a0a0a0;white-space:nowrap}
  .chip svg{color:#7d7d7d}
  .chip.on{color:#ededed;border-color:#ededed}
  .chip.on svg{color:#ededed}
</style>
<div class="card">
  <div class="top">
    <div class="mark"><img src="../suede-ai-logo-transparent.png" alt="">SuedeAI.directory</div>
    <div class="by">by <b>Suede AI</b></div>
  </div>
  <div class="body">
    <div>
      <h1>Agent skills, graded and ready to install<i>&#9646;</i></h1>
      <p class="sub">Skills for Claude Code, Codex and Cursor, scored 0 to 99 from their files and linked to source.</p>
    </div>
    <div>
      <div class="field"><img src="directory-card-matrix.svg" alt=""></div>
      <div class="legend"><span><i style="background:#00ca52"></i>A</span><span><i style="background:#50a8ff"></i>B</span><span><i style="background:#ffb200"></i>C</span><span><i style="background:#454545"></i>D</span><span>one dot per listed skill</span></div>
    </div>
  </div>
  <div class="chips">
