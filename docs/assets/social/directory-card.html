<!doctype html><meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Agent Skills Directory social card</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;background:#080808}
  body{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#f0ece4}
  .card{position:relative;width:1200px;height:630px;padding:64px 72px;display:flex;flex-direction:column;justify-content:space-between;
    background:radial-gradient(60% 70% at 85% 20%,rgba(200,169,110,.18) 0%,rgba(200,169,110,0) 70%),linear-gradient(180deg,#0d0d0c 0%,#080808 100%)}
  .eyebrow{font-size:20px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#c6625a}
  h1{margin-top:22px;font-family:Georgia,"Times New Roman",serif;font-weight:600;font-size:92px;line-height:1;letter-spacing:-.02em}
  .sub{margin-top:24px;font-size:32px;line-height:1.35;color:#c8c3b8;max-width:900px}
  .row{display:flex;gap:16px;flex-wrap:wrap}
  .chip{border:1px solid rgba(200,169,110,.55);border-radius:6px;padding:12px 18px;font-size:22px;color:#c8a96e;font-weight:600}
  .foot{display:flex;justify-content:space-between;align-items:flex-end;font-size:22px;color:#888880}
  .foot b{color:#f0ece4;font-weight:600}
</style>
<div class="card">
  <div>
    <div class="eyebrow">Suede Skills Directory</div>
    <h1>Agent Skills Directory</h1>
    <p class="sub">Public skills for Claude Code, Codex and Cursor, sorted by what they do.</p>
  </div>
  <div class="row">
    <span class="chip">Graded by an 8-part check</span>
    <span class="chip">Linked to the author's repo</span>
    <span class="chip">License on every page</span>
  </div>
  <div class="foot"><span><b>skills.suedeai.ai</b>/directory</span><span>Suede AI</span></div>
</div>
