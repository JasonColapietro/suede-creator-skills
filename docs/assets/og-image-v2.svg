<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Suede AI Skills</title>
  <desc id="desc">Open-source agent skills for Claude Code and Codex.</desc>
  <rect width="1200" height="630" fill="#060b0d"/>
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="#0c1519" stroke="#263c43" stroke-width="2"/>
  <defs><pattern id="cipher-grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#61e6ed" stroke-opacity=".08"/></pattern></defs>
  <rect x="33" y="33" width="1134" height="564" rx="15" fill="url(#cipher-grid)"/>
  <path d="M76 32H300M900 598H1124" stroke="#b6ff4d" stroke-width="4"/>
  <path d="M32 168H1168" stroke="#61e6ed" stroke-opacity=".45" stroke-width="2"/>
  <path d="M424 168V598" stroke="#263c43" stroke-width="2"/>

  <defs>
    <clipPath id="suede-mark-clip">
      <rect width="64" height="64" rx="10"/>
    </clipPath>
  </defs>

  <g transform="translate(76 70)">
    <g id="suede-mark" clip-path="url(#suede-mark-clip)">
      <image data-approved-suede-mark="true" href="suede-ai-logo-transparent.png" width="64" height="64" preserveAspectRatio="xMidYMid slice"/>
    </g>
    <text x="86" y="28" fill="#e6f3ee" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800" letter-spacing="4">SUEDE</text>
    <text x="86" y="56" fill="#9aafb2" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="3">AI SKILLS</text>
  </g>

  <g transform="translate(76 208)">
    <text x="0" y="225" fill="#b6ff4d" font-family="Arial, Helvetica, sans-serif" font-size="250" font-weight="900" letter-spacing="-18">67</text>
    <text x="6" y="280" fill="#9aafb2" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4">INSTALLABLE SKILLS</text>
  </g>

  <g transform="translate(476 214)">
    <text x="0" y="58" fill="#e6f3ee" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">OPEN-SOURCE</text>
    <text x="0" y="119" fill="#e6f3ee" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" letter-spacing="-1">AGENT SKILLS</text>
    <text x="2" y="169" fill="#b6ff4d" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Claude Code + OpenAI Codex</text>

    <g fill="#9aafb2" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600">
      <text x="2" y="225">CODE REVIEW  ·  SHIP GATES  ·  AI EVALS</text>
      <text x="2" y="260">DESIGN  ·  SEO  ·  iOS  ·  CREATOR WORKFLOWS</text>
    </g>

    <rect x="0" y="309" width="362" height="62" rx="6" fill="#b6ff4d"/>
    <text x="28" y="350" fill="#060b0d" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" letter-spacing="2">STAR THE REPO  →</text>
    <text x="388" y="348" fill="#9aafb2" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">MIT LICENSED</text>
  </g>
